name: Build EXE and macOS App

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --onefile --name MQTT-Monitor-Dashboard --add-data "config.json;." app.py

      - name: Stage output
        run: |
          mkdir dist_win
          copy dist\MQTT-Monitor-Dashboard.exe dist_win\
          copy config.json dist_win\
          copy README.md dist_win\ 2>NUL || echo skip

      - name: Zip output
        run: powershell Compress-Archive -Path dist_win\* -DestinationPath MQTT-Monitor-Dashboard-windows.zip

      # Nur bei Tag-Push oder manuellem Start wird das Artefakt tatsaechlich
      # gespeichert (Speicherkontingent!) - ein normaler Push baut nur zur
      # Fehlerpruefung, ohne Speicher zu verbrauchen.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: windows-exe
          path: MQTT-Monitor-Dashboard-windows.zip
          retention-days: 5

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app (ARM64)
        run: |
          pyinstaller --windowed --name "MQTT-Monitor-Dashboard" --add-data "config.json:." app.py

      - name: Stage output
        run: |
          mkdir -p dist_mac
          cp -R "dist/MQTT-Monitor-Dashboard.app" dist_mac/
          cp config.json dist_mac/
          [ -f README.md ] && cp README.md dist_mac/ || true

      - name: Zip output
        run: |
          cd dist_mac && zip -rq ../MQTT-Monitor-Dashboard-macos.zip . && cd ..

      # Nur bei Tag-Push oder manuellem Start wird das Artefakt tatsaechlich
      # gespeichert (Speicherkontingent!) - ein normaler Push baut nur zur
      # Fehlerpruefung, ohne Speicher zu verbrauchen.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: macos-app
          path: MQTT-Monitor-Dashboard-macos.zip
          retention-days: 5

  package-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # windows-exe/macos-app enthalten bereits die fertigen ZIPs (siehe
      # vorherige Jobs) - hier nur einsammeln, kein erneutes Zippen noetig.
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: windows-exe

      - uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: macos-app

      - name: Zip-Dateien an bekannten Ort legen
        run: |
          mv windows-exe/MQTT-Monitor-Dashboard-windows.zip .
          mv macos-app/MQTT-Monitor-Dashboard-macos.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MQTT-Monitor-Dashboard-windows.zip
            MQTT-Monitor-Dashboard-macos.zip
